name: Deploy to green.ch

# Läuft automatisch bei jedem Push/Merge auf main -> main = das, was live ist
on:
  push:
    branches: [main]

  # Erlaubt auch manuelles Auslösen im "Actions"-Tab von GitHub
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Per FTPS auf green.ch hochladen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<'EOF_LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 6
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          set net:timeout 20
          set mirror:parallel-transfer-count 1

          mirror --reverse --verbose --only-newer \
            --exclude-glob .git* \
            --exclude-glob .github/ \
            --exclude-glob node_modules/ \
            --exclude package.json \
            --exclude package-lock.json \
            --exclude tsconfig.json \
            --exclude nodemon.json \
            --exclude-glob sql/ \
            --exclude src/backend/config/env.php \
            --exclude src/backend/config/env.example.php \
            --exclude README.md \
            --exclude DEPLOY.md \
            --exclude FIXES.md \
            ./ ./

          bye
          EOF_LFTP
